  body{ background:var(--bg); margin:0; }

  for (var i2 = 0; i2 < n; i2++){
    var ry = i2 * cell + cell / 2;
    var rt = el('text', {x: 0, y: ry, 'text-anchor':'end', 'dominant-baseline':'middle', 'font-size':'9.5'});
    rt.textContent = features[i2];
    gRowLabels.appendChild(rt);

    var cx = i2 * cell + cell / 2;
    var ct = el('text', {
      x: 0, y: 0, 'text-anchor':'start', 'font-size':'9.5',
      transform: 'translate(' + cx + ',0) rotate(-60)'
    });
    ct.textContent = features[i2];
    gColLabels.appendChild(ct);
  }

  svg.appendChild(gGrid);
  svg.appendChild(gRowLabels);
  svg.appendChild(gColLabels);

  function repaint(){
    var mode = currentMode();
    var stops = mode === 'dark' ? stopsDark : stopsLight;
    rects.forEach(function(item){
      item.node.setAttribute('fill', colorFor(item.v, stops));
    });
    paintLegend(mode);
  }

  var legendSvg = document.getElementById('legend');
  function paintLegend(mode){
    legendSvg.innerHTML = '';
    var stops = mode === 'dark' ? stopsDark : stopsLight;
    var w = 220, h = 14, steps = 60;
    for (var s = 0; s < steps; s++){
      var v = -1 + (2 * s / (steps - 1));
      var x = (s / steps) * w;
      var rectEl = el('rect', {
        x: x, y: 0, width: (w / steps) + 0.6, height: h,
        fill: colorFor(v, stops)
      });
      legendSvg.appendChild(rectEl);
    }
  }

  var tooltip = document.getElementById('tooltip');
  svg.addEventListener('mousemove', function(e){
    var t = e.target;
    if (t && t.classList && t.classList.contains('cell')){
      var f1 = t.getAttribute('data-f1'), f2 = t.getAttribute('data-f2'), r = t.getAttribute('data-r');
      tooltip.innerHTML = '<b>' + f1 + '</b> &harr; <b>' + f2 + '</b><br>r = ' + r;
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top = (e.clientY + 14) + 'px';
    }
  });
  svg.addEventListener('mouseleave', function(){ tooltip.style.display = 'none'; });

  repaint();

  if (window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', repaint);
  }
  new MutationObserver(repaint).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
})();
</script>

</body></html>
